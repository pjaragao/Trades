<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Entrar · Copiloto de Trades</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(380px, 100%); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="card card-pad login stack" method="post" autocomplete="on">
      <div class="brand" style="padding:0">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-8"/></svg>
        </div>
        <div><div class="brand-name">Copiloto de Trades</div><div class="brand-sub">Acesso protegido</div></div>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" class="input" autofocus required autocomplete="current-password">
      </div>
      {% if error %}<div class="note danger">{{ error }}</div>{% endif %}
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
