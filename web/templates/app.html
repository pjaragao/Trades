<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Copiloto de Trades</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322d3a6'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='%2304261d' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v={{ version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}?v={{ version }}">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-8"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Copiloto</div>
          <div class="brand-sub">de Trades · v{{ version }}</div>
        </div>
      </div>
      <nav class="nav" id="nav-side"></nav>
      <div class="sidebar-foot" id="sidebar-foot">
        <div><strong>Execução manual</strong></div>
        <div>MT5 desligado (Fase 6). Você executa no Home Broker.</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Hoje</div>
        <div class="topbar-mini" id="topbar-mini"></div>
        <div class="topbar-chips" id="topbar-chips"></div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" id="btn-sync" title="Sincronizar agora" aria-label="Sincronizar agora"></button>
          <button class="btn btn-ghost btn-icon bell" id="btn-bell" title="Alertas" aria-label="Alertas" aria-haspopup="true"></button>
        </div>
      </header>
      <div id="alerts-popover" class="popover" hidden></div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottomnav" id="nav-bottom" aria-label="Navegação"></nav>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v={{ version }}"></script>
</body>
</html>
