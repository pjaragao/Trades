# Copiloto de Trades no homelab (Docker Compose puro ou Coolify).
#
#   Docker Compose:  cp .env.example .env  (preencha)  ->  docker compose up -d --build  ->  http://<ip>:5000
#   Coolify:         novo recurso "Docker Compose" apontando para este repositório; as variáveis abaixo
#                    aparecem na aba Environment Variables. Associe o domínio ao serviço "copiloto" na porta 5000.
#
# As variáveis usam ${VAR:-padrão}: o Docker Compose lê o arquivo .env desta pasta e o Coolify mostra cada uma na UI.
services:
  copiloto:
    build:
      context: .
      args:
        INSTALL_LAB: ${INSTALL_LAB:-false}   # "true" para previsão TimesFM (imagem ~1 GB maior)
    image: copiloto-trades:latest
    restart: unless-stopped
    ports:
      - "${COPILOTO_PORT:-5000}:5000"   # no Coolify pode remover: o proxy dele acessa a porta 5000 pela rede interna
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # acesso
      COPILOTO_PASSWORD: ${COPILOTO_PASSWORD:?defina COPILOTO_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # TradingFloors
      TF_EMAIL: ${TF_EMAIL:-}
      TF_PASSWORD: ${TF_PASSWORD:-}
      # alertas
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # cotações
      QUOTES_PROVIDER: ${QUOTES_PROVIDER:-auto}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      BRAPI_DAILY_BUDGET: ${BRAPI_DAILY_BUDGET:-450}
      QUOTES_INTERVAL: ${QUOTES_INTERVAL:-2}
      # MT5 (agente no Windows) e execução de ordens
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      EXECUTION_BROKER: ${EXECUTION_BROKER:-mt5_remote}
      MT5_AGENT_URL: ${MT5_AGENT_URL:-}
      MT5_AGENT_TOKEN: ${MT5_AGENT_TOKEN:-}
    volumes:
      # banco (app.db), chave de sessão e, opcionalmente, o cache antigo backtest_cache.db
      - ./data:/data
      # opcional: sobrescrever a configuração de infraestrutura
      # - ./config/settings.yaml:/app/config/settings.yaml:ro
